[project]
name = "ops-deck-rag"
version = "0.1.0"
description = "RAG assistant for monthly operations PowerPoint decks with slide text, tables, and chart data extraction."
requires-python = ">=3.10"
dependencies = [
  "python-pptx>=0.6.23",
  "pandas>=2.0.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=2.7.0",
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",
  "groq>=0.9.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]
ocr = [
  "pytesseract>=0.3.10",
  "pillow>=10.0.0"
]

[project.scripts]
ops-rag = "ops_deck_rag.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
